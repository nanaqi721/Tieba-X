# RocketMQ 集群名称
brokerClusterName=DefaultCluster

# Broker 名称
brokerName=broker-a

# Broker ID
# 0 表示 Master，大于 0 表示 Slave
brokerId=0

# 每天凌晨 4 点删除过期消息
deleteWhen=04

# 消息文件保留 72 小时
fileReservedTime=72

# Broker 角色
# ASYNC_MASTER 表示异步刷盘的主节点
brokerRole=ASYNC_MASTER

# 磁盘刷盘方式
# ASYNC_FLUSH 性能更高，允许操作系统异步刷盘
flushDiskType=ASYNC_FLUSH

# Broker 向 NameServer 注册的地址
# Docker 内其他服务可以通过 rocketmq-broker 找到它
brokerIP1=rocketmq-broker

# Broker 主要通信端口
listenPort=10911

# 开发阶段允许自动创建 Topic
autoCreateTopicEnable=true