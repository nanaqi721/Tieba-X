server:
  port: 8082

spring:
  application:
    name: user-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    url: jdbc:mysql://192.168.88.130:3307/teiba_X?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    hikari:
      minimum-idle: 5          # 池中保持的空闲连接数
      maximum-pool-size: 10
      initialization-fail-timeout: 30000  # 启动时预创建连接，超过则启动失败（fail-fast）
      connection-timeout: 5000
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.88.130:8848

  data:
    redis:
      host: 192.168.88.130
      port: 6379
      password: 123456
      database: 2
      connect-timeout: 5s

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:192.168.88.130:9876}

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted # 全局逻辑删除字段名(deleted为实体类属性名称)
      logic-delete-value: 1 # 逻辑已删除值。可选，默认值为 1
      logic-not-delete-value: 0 # 逻辑未删除值。可选，默认值为 0

sa-token:
  token-name: satoken        # 请求头/参数名
  timeout: 2592000           # token 有效期 30 天
  active-timeout: -1         # 关闭不活跃过期
  is-concurrent: false        # 同端互斥：同账号同终端只允许一个在线，新登录顶掉旧登录
  is-share: false             # 每次登录生成独立 token
  token-style: uuid
  is-log: false
